<text x="1.100" y="35.450" font-size="0.13" fill="#000000" font-weight="400" text-anchor="start" font-family="'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif">22 x 28.5 in studs (verticals)</text>
<text x="5.700" y="35.450" font-size="0.11" fill="#555555" font-weight="400" text-anchor="start" font-family="'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif">(8 ft = 3 studs)</text>
<text x="0.900" y="35.750" font-size="0.13" fill="#000000" font-weight="400" text-anchor="start" font-family="'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif">-</text>
<text x="1.100" y="35.750" font-size="0.13" fill="#000000" font-weight="400" text-anchor="start" font-family="'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif">22 x 29 in cross stretchers</text>
<text x="5.700" y="35.750" font-size="0.11" fill="#555555" font-weight="400" text-anchor="start" font-family="'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif">(8 ft = 3 stretchers)</text>
