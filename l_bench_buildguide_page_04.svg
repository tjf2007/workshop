<text x="0.500" y="33.850" font-size="0.34" fill="#000000" font-weight="600" text-anchor="start" font-family="'Abel', 'Helvetica Neue', Helvetica, Arial, sans-serif">Cut Day 1: 2x4 Lumber</text>
