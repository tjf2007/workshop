<text x="0.500" y="50.420" font-size="0.12" fill="#000000" font-weight="400" text-anchor="start" font-family="'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif">Drill 4 lag-bolt clearance holes at the corners (1/4 in dia),</text>
<text x="0.500" y="50.620" font-size="0.12" fill="#000000" font-weight="400" text-anchor="start" font-family="'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif">located 2 in in from each edge (4 corners, 4 holes total).</text>
<text x="0.500" y="50.820" font-size="0.12" fill="#000000" font-weight="400" text-anchor="start" font-family="'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif">Dry-fit into the cavity at z=4. Confirm 1 in clearance all around.</text>
