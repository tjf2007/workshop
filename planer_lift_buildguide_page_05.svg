<text x="0.500" y="49.820" font-size="0.12" fill="#000000" font-weight="400" text-anchor="start" font-family="'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif">Cut a 28 x 28 in piece of 3/4 in plywood (already cut during</text>
