<text x="0.750" y="127.650" font-size="0.13" fill="#1A1A1A" font-weight="normal" text-anchor="start" font-family="Helvetica,Arial,sans-serif">Stand both short-leg walls parallel, 36 in apart (outside-out).</text>
<text x="0.750" y="127.850" font-size="0.13" fill="#1A1A1A" font-weight="normal" text-anchor="start" font-family="Helvetica,Arial,sans-serif">Connect with 8 cross stretchers (29 in each):</text>
<text x="0.750" y="128.050" font-size="0.13" fill="#1A1A1A" font-weight="normal" text-anchor="start" font-family="Helvetica,Arial,sans-serif">  - 4 at TOP rail level at Y=38.5, 72, 80.5, 116</text>
<text x="0.750" y="128.250" font-size="0.13" fill="#1A1A1A" font-weight="normal" text-anchor="start" font-family="Helvetica,Arial,sans-serif">  - 4 at BOTTOM rail level, same Y positions</text>
<text x="0.750" y="128.450" font-size="0.13" fill="#1A1A1A" font-weight="normal" text-anchor="start" font-family="Helvetica,Arial,sans-serif">Glue + screw at each joint.</text>
<text x="0.750" y="128.650" font-size="0.13" fill="#1A1A1A" font-weight="normal" text-anchor="start" font-family="Helvetica,Arial,sans-serif">Result: rigid 36 x 84 x 37 in box.</text>
