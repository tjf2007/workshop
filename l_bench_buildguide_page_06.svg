<text x="0.500" y="60.540" font-size="0.13" fill="#000000" font-weight="400" text-anchor="start" font-family="'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif">Lay the 144 in bottom rail on the floor on its narrow edge.</text>
<text x="0.500" y="60.760" font-size="0.13" fill="#000000" font-weight="400" text-anchor="start" font-family="'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif">Mark stud positions on the rail: 0, 24, 46.5, 86, 104.5, 132, 140.5.</text>
<text x="0.500" y="60.980" font-size="0.13" fill="#000000" font-weight="400" text-anchor="start" font-family="'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif">Lay the top rail parallel, 28.5 in away.</text>
<text x="0.500" y="61.200" font-size="0.13" fill="#000000" font-weight="400" text-anchor="start" font-family="'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif">Stand 7 studs (28.5 in) vertically between the rails at marks.</text>
<text x="0.500" y="61.420" font-size="0.13" fill="#000000" font-weight="400" text-anchor="start" font-family="'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif">Glue + 2 screws per joint, toenailed through rail into stud end.</text>
<text x="0.500" y="61.640" font-size="0.13" fill="#000000" font-weight="400" text-anchor="start" font-family="'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif">CHECK SQUARE: measure both diagonals - match within 1/8 in.</text>
