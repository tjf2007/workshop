<text x="0.750" y="61.650" font-size="0.13" fill="#1A1A1A" font-weight="normal" text-anchor="start" font-family="Helvetica,Arial,sans-serif">Lay the 144 in bottom rail on the floor on its narrow edge.</text>
<text x="0.750" y="61.850" font-size="0.13" fill="#1A1A1A" font-weight="normal" text-anchor="start" font-family="Helvetica,Arial,sans-serif">Mark stud positions on the rail: 0, 24, 46.5, 86, 104.5, 132, 140.5.</text>
<text x="0.750" y="62.050" font-size="0.13" fill="#1A1A1A" font-weight="normal" text-anchor="start" font-family="Helvetica,Arial,sans-serif">Lay the top rail parallel, 28.5 in away.</text>
<text x="0.750" y="62.250" font-size="0.13" fill="#1A1A1A" font-weight="normal" text-anchor="start" font-family="Helvetica,Arial,sans-serif">Stand 7 studs (28.5 in) vertically between the rails at marks.</text>
<text x="0.750" y="62.450" font-size="0.13" fill="#1A1A1A" font-weight="normal" text-anchor="start" font-family="Helvetica,Arial,sans-serif">Glue + 2 screws per joint, toenailed through rail into stud end.</text>
<text x="0.750" y="62.650" font-size="0.13" fill="#1A1A1A" font-weight="normal" text-anchor="start" font-family="Helvetica,Arial,sans-serif">CHECK SQUARE: measure both diagonals - match within 1/8 in.</text>
