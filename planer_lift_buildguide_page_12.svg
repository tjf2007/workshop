<text x="8.000" y="121.850" font-size="0.14" fill="#555555" font-weight="400" text-anchor="end" font-family="'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif">ELECTRICAL SCHEMATIC</text>
<line x1="0.500" y1="122.050" x2="8.000" y2="122.050" stroke="#000000" stroke-width="0.012" />
<text x="4.250" y="131.700" font-size="0.11" fill="#555555" font-weight="400" text-anchor="middle" font-family="'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif">12 / 17</text>
<text x="1.000" y="122.600" font-size="0.12" fill="#000000" font-weight="600" text-anchor="start" font-family="'Abel', 'Helvetica Neue', Helvetica, Arial, sans-serif">120V AC power flow with two reed-switch end stops</text>
<circle cx="1.300" cy="123.800" r="0.200" fill="none" stroke="#000000" stroke-width="0.012" />
<text x="1.300" y="123.850" font-size="0.18" fill="#000000" font-weight="600" text-anchor="middle" font-family="'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif">~</text>
<text x="1.300" y="124.150" font-size="0.1" fill="#000000" font-weight="400" text-anchor="middle" font-family="'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif">120V AC</text>
<line x1="1.500" y1="123.800" x2="2.500" y2="123.800" stroke="#000000" stroke-width="0.012" />
<rect x="2.500" y="123.200" width="1.500" height="1.200" fill="none" opacity="1.0" stroke="#000000" stroke-width="0.012" />
<text x="3.250" y="123.140" font-size="0.11" fill="#000000" font-weight="600" text-anchor="middle" font-family="'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif">RELAY</text>
<text x="3.250" y="123.400" font-size="0.09" fill="#000000" font-weight="400" text-anchor="middle" font-family="'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif">12V coil</text>
<text x="3.250" y="123.700" font-size="0.09" fill="#000000" font-weight="400" text-anchor="middle" font-family="'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif">10A contacts</text>
<text x="3.250" y="124.000" font-size="0.09" fill="#000000" font-weight="400" text-anchor="middle" font-family="'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif">(NO + NC)</text>
<line x1="4.000" y1="123.800" x2="5.100" y2="123.800" stroke="#000000" stroke-width="0.012" />
<rect x="5.100" y="123.550" width="1.400" height="0.500" fill="#444444" opacity="1.0" stroke="#000000" stroke-width="0.012" />
<text x="5.800" y="123.850" font-size="0.12" fill="white" font-weight="600" text-anchor="middle" font-family="'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif">DRILL</text>
<text x="5.800" y="123.400" font-size="0.09" fill="#000000" font-weight="400" text-anchor="middle" font-family="'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif">trigger zip-tied DOWN</text>
<text x="1.300" y="124.700" font-size="0.11" fill="#000000" font-weight="600" text-anchor="start" font-family="'Abel', 'Helvetica Neue', Helvetica, Arial, sans-serif">RELAY COIL CONTROL (12V DC, low current)</text>
<rect x="1.300" y="124.900" width="0.600" height="0.500" fill="none" opacity="1.0" stroke="#000000" stroke-width="0.012" />
<text x="1.600" y="125.080" font-size="0.11" fill="#000000" font-weight="600" text-anchor="middle" font-family="'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif">12V</text>
<text x="1.600" y="125.300" font-size="0.08" fill="#000000" font-weight="400" text-anchor="middle" font-family="'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif">wallwart</text>
<line x1="1.900" y1="125.000" x2="2.700" y2="125.000" stroke="#000000" stroke-width="0.012" />
<rect x="2.700" y="124.850" width="0.800" height="0.300" fill="none" opacity="1.0" stroke="#3A3A48" stroke-width="0.012" />
<line x1="2.800" y1="125.000" x2="3.400" y2="125.000" stroke="#3A3A48" stroke-width="0.012" />
<line x1="3.100" y1="124.900" x2="3.400" y2="124.900" stroke="#3A3A48" stroke-width="0.012" />
<text x="3.100" y="124.750" font-size="0.08" fill="#000000" font-weight="400" text-anchor="middle" font-family="'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif">REED TOP</text>
<text x="3.100" y="125.300" font-size="0.08" fill="#000000" font-weight="400" text-anchor="middle" font-family="'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif">(NC)</text>
<line x1="3.500" y1="125.000" x2="4.200" y2="125.000" stroke="#000000" stroke-width="0.012" />
<rect x="4.200" y="124.850" width="0.800" height="0.300" fill="none" opacity="1.0" stroke="#3A3A48" stroke-width="0.012" />
<line x1="4.300" y1="125.000" x2="4.900" y2="125.000" stroke="#3A3A48" stroke-width="0.012" />
<line x1="4.600" y1="124.900" x2="4.900" y2="124.900" stroke="#3A3A48" stroke-width="0.012" />
<text x="4.600" y="124.750" font-size="0.08" fill="#000000" font-weight="400" text-anchor="middle" font-family="'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif">REED BOTTOM</text>
<text x="4.600" y="125.300" font-size="0.08" fill="#000000" font-weight="400" text-anchor="middle" font-family="'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif">(NC)</text>
<line x1="5.000" y1="125.000" x2="5.600" y2="125.000" stroke="#000000" stroke-width="0.012" />
<line x1="5.600" y1="125.000" x2="5.600" y2="125.500" stroke="#000000" stroke-width="0.012" />
<rect x="5.450" y="125.500" width="0.300" height="0.300" fill="none" opacity="1.0" stroke="#000000" stroke-width="0.012" />
<text x="5.600" y="125.700" font-size="0.1" fill="#000000" font-weight="600" text-anchor="middle" font-family="'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif">C</text>
<line x1="5.600" y1="125.800" x2="5.600" y2="126.000" stroke="#000000" stroke-width="0.012" />
<line x1="5.600" y1="126.000" x2="1.600" y2="126.000" stroke="#000000" stroke-width="0.012" />
<line x1="1.600" y1="126.000" x2="1.600" y2="125.400" stroke="#000000" stroke-width="0.012" />
<line x1="0.500" y1="128.800" x2="8.000" y2="128.800" stroke="#777777" stroke-width="0.006" />
<text x="0.500" y="129.100" font-size="0.14" fill="#000000" font-weight="600" text-anchor="start" font-family="'Abel', 'Helvetica Neue', Helvetica, Arial, sans-serif">HOW IT WORKS</text>
<text x="0.500" y="129.400" font-size="0.11" fill="#000000" font-weight="400" text-anchor="start" font-family="'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif">Both reed switches are NORMALLY CLOSED. When neither magnet is near,</text>
<text x="0.500" y="129.580" font-size="0.11" fill="#000000" font-weight="400" text-anchor="start" font-family="'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif">current flows through both switches in series, energizing the relay coil.</text>
<text x="0.500" y="129.760" font-size="0.11" fill="#000000" font-weight="400" text-anchor="start" font-family="'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif">Relay closes the AC contacts -&gt; drill has power.</text>
<text x="0.500" y="129.940" font-size="0.11" fill="#000000" font-weight="400" text-anchor="start" font-family="'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif"></text>
<text x="0.500" y="130.120" font-size="0.11" fill="#000000" font-weight="400" text-anchor="start" font-family="'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif">When the sled reaches EITHER end of travel, the magnet on the sled edge</text>
<text x="0.500" y="130.300" font-size="0.11" fill="#000000" font-weight="400" text-anchor="start" font-family="'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif">comes near its matching reed switch. The reed OPENS, breaking the coil</text>
<text x="0.500" y="130.480" font-size="0.11" fill="#000000" font-weight="400" text-anchor="start" font-family="'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif">circuit. Relay drops out, AC contacts open, DRILL LOSES POWER.</text>
<text x="0.500" y="130.660" font-size="0.11" fill="#000000" font-weight="400" text-anchor="start" font-family="'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif"></text>
<text x="0.500" y="130.840" font-size="0.11" fill="#000000" font-weight="400" text-anchor="start" font-family="'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif">Operator reverses the drill direction by hand (the direction switch on</text>
<text x="0.500" y="131.020" font-size="0.11" fill="#000000" font-weight="400" text-anchor="start" font-family="'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif">the drill body is still accessible) and runs again. Magnet leaves the</text>
<text x="0.500" y="131.200" font-size="0.11" fill="#000000" font-weight="400" text-anchor="start" font-family="'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif">switch zone, reed closes, relay re-energizes, drill spins again.</text>
<text x="0.500" y="131.380" font-size="0.11" fill="#000000" font-weight="400" text-anchor="start" font-family="'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif"></text>
<text x="0.500" y="131.560" font-size="0.11" fill="#000000" font-weight="400" text-anchor="start" font-family="'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif">OPTIONAL: add a foot-pedal switch in series with the 12V supply so the</text>
<text x="0.500" y="131.740" font-size="0.11" fill="#000000" font-weight="400" text-anchor="start" font-family="'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif">operator can KILL the drill instantly without leaning over the planer.</text>
</svg>