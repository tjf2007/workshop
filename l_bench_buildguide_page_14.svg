<text x="0.750" y="149.350" font-size="0.16" fill="#1A1A1A" font-weight="bold" text-anchor="start" font-family="Helvetica,Arial,sans-serif">Instructions</text>
<text x="0.750" y="149.650" font-size="0.13" fill="#1A1A1A" font-weight="normal" text-anchor="start" font-family="Helvetica,Arial,sans-serif">While you can still reach the bottom rails:</text>
<text x="0.750" y="149.850" font-size="0.13" fill="#1A1A1A" font-weight="normal" text-anchor="start" font-family="Helvetica,Arial,sans-serif">TopLeg back: 144 x 4 against back face of bottom rail.</text>
<text x="0.750" y="150.050" font-size="0.13" fill="#1A1A1A" font-weight="normal" text-anchor="start" font-family="Helvetica,Arial,sans-serif">TopLeg front: 144 x 4 recessed 3 in from front face.</text>
<text x="0.750" y="150.250" font-size="0.13" fill="#1A1A1A" font-weight="normal" text-anchor="start" font-family="Helvetica,Arial,sans-serif">TopLeg right end: 36 x 4 capping the right end.</text>
<text x="0.750" y="150.450" font-size="0.13" fill="#1A1A1A" font-weight="normal" text-anchor="start" font-family="Helvetica,Arial,sans-serif">Short leg left side: 84 x 4 against LHS wall.</text>
<text x="0.750" y="150.650" font-size="0.13" fill="#1A1A1A" font-weight="normal" text-anchor="start" font-family="Helvetica,Arial,sans-serif">Short leg right (room-facing) side: 84 x 4 recessed 3 in.</text>
